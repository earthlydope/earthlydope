<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="1000" height="170" role="img" aria-labelledby="t d">
  <title id="t">Let's build something useful</title>
  <desc id="d">Animated wave footer with the closing line.</desc>
  <defs>
    <clipPath id="card"><rect width="1000" height="170" rx="18"/></clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F24"/><stop offset="0.6" stop-color="#151B3F"/><stop offset="1" stop-color="#0A0F24"/></linearGradient>
    <linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="250" y1="0" x2="750" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#22D3EE"/><stop offset="0.33" stop-color="#8B5CF6"/><stop offset="0.66" stop-color="#F472B6"/><stop offset="1" stop-color="#22D3EE"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="500 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.55"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0.05"/></linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.45"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0.04"/></linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F472B6" stop-opacity="0.35"/><stop offset="1" stop-color="#F472B6" stop-opacity="0.03"/></linearGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="170" fill="url(#bg)"/>
    <path d="M0 118 Q125.0 106 250.0 118 T500.0 118 T750.0 118 T1000.0 118 T1250.0 118 T1500.0 118 T1750.0 118 T2000.0 118 L2000 170 L0 170 Z" fill="url(#w1)"><animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="16s" repeatCount="indefinite"/></path>
    <path d="M0 132 Q125.0 117 250.0 132 T500.0 132 T750.0 132 T1000.0 132 T1250.0 132 T1500.0 132 T1750.0 132 T2000.0 132 L2000 170 L0 170 Z" fill="url(#w2)"><animateTransform attributeName="transform" type="translate" from="-1000 0" to="0 0" dur="24s" repeatCount="indefinite"/></path>
    <path d="M0 146 Q125.0 137 250.0 146 T500.0 146 T750.0 146 T1000.0 146 T1250.0 146 T1500.0 146 T1750.0 146 T2000.0 146 L2000 170 L0 170 Z" fill="url(#w3)"><animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="32s" repeatCount="indefinite"/></path>
    <text x="500" y="62" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="34" font-weight="800" fill="url(#tg)">Let's build something useful</text>
    <text x="500" y="92" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="15" fill="#CBD5E1">Enterprise AI, designed and engineered from the first discovery call to production.</text>
  </g>
  <rect x="0.5" y="0.5" width="999" height="169" rx="18" fill="none" stroke="#1E293B"/>
</svg>
